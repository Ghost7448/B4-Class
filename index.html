<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d28d9">
  <title>Class Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader-ring"></div><span>Loading Class Hub...</span></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/logo.jpg" alt="Class logo">
        <div><strong>Class Hub</strong><small id="classLabel">Class A2</small></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard">⌂ <span data-i18n="dashboard">Dashboard</span></button>
        <button class="nav-item" data-view="students">♙ <span data-i18n="students">Students</span></button>
        <button class="nav-item" data-view="subjects">▣ <span data-i18n="subjects">Subjects</span></button>
        <button class="nav-item" data-view="schedule">◫ <span data-i18n="schedule">Schedule</span></button>
        <button class="nav-item" data-view="assignments">✓ <span data-i18n="assignments">Assignments</span></button>
        <button class="nav-item" data-view="announcements">◈ <span data-i18n="announcements">Announcements</span></button>
        <button class="nav-item" data-view="calendar">◷ <span data-i18n="calendar">Calendar</span></button>
        <button class="nav-item" data-view="gallery">▧ <span data-i18n="gallery">Gallery</span></button>
        <button class="nav-item" data-view="polls">☷ <span data-i18n="polls">Polls</span></button>
        <button class="nav-item" data-view="leaderboard">★ <span data-i18n="leaderboard">Leaderboard</span></button>
        <button class="nav-item" data-view="admin">⚙ <span data-i18n="admin">Admin</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="themeBtn">☾ <span data-i18n="theme">Dark mode</span></button>
        <button class="nav-item" id="langBtn">文 <span>العربية</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="search-wrap">
          <span>⌕</span><input id="globalSearch" data-placeholder="search" placeholder="Search everything...">
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="notificationBtn" title="Notifications">🔔<b class="dot"></b></button>
          <button class="profile" id="profileBtn"><img src="assets/logo.jpg" alt=""><span>Kareem</span><small>▾</small></button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
