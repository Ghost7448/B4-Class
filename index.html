<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Class Hub Pro A2 - Class management dashboard">
<link rel="manifest" href="manifest.webmanifest">
<title>Class Hub Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
.role-pill{display:inline-flex;padding:10px 16px;border-radius:999px;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);font-weight:800;margin:8px 0 18px}
@media(max-width:760px){body{padding-bottom:72px}.mobile-dock{display:flex!important;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:var(--card);border:1px solid var(--line);box-shadow:0 15px 40px #0002;border-radius:18px;padding:8px;gap:6px;backdrop-filter:blur(18px)}.mobile-dock button{flex:1;border:0;background:transparent;color:var(--t);padding:9px 4px;border-radius:12px;font:inherit;font-size:11px}.mobile-dock button:hover{background:var(--soft);color:var(--p)}}
@media(min-width:761px){.mobile-dock{display:none!important}}
</style>
</head>
<body>
<div id="loader">
  <div class="loader-logo">
    <img src="assets/logo.jpg" alt="Class Hub" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 rx=%2245%22 fill=%22%237c3aed%22/%3E%3Ctext x=%22100%22 y=%22122%22 text-anchor=%22middle%22 font-size=%2282%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22%3EA2%3C/text%3E%3C/svg%3E'">
  </div>
  <div class="loader-ring"></div>
  <b>CLASS HUB</b>
  <small>Loading your class...</small>
</div>
<div id="glow"></div>
<div class="app">
<aside id="side">
  <div class="brand">
    <img src="assets/logo.jpg" alt="Class Hub" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 rx=%2245%22 fill=%22%237c3aed%22/%3E%3Ctext x=%22100%22 y=%22122%22 text-anchor=%22middle%22 font-size=%2282%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22%3EA2%3C/text%3E%3C/svg%3E'">
    <div><b>Class Hub</b><small>A2 • Pro</small></div>
  </div>
  <div class="live"><i></i><div><b>LIVE NOW</b><small>Networking • <span id="miniTime">32:15</span></small></div></div>
  <nav id="nav"></nav>
  <div class="side-bottom">
    <button id="theme">◐ <span></span></button>
    <button id="lang">文 <span>العربية</span></button>
    <button id="install">⌄ <span>Install App</span></button>
  </div>
</aside>
<main>
<header>
  <button id="mobile">☰</button>
  <div class="search">⌕ <input id="search" placeholder="Search everything..." autocomplete="off"></div>
  <div class="top">
    <button id="ai">✦</button>
    <button id="bell">♢<i></i></button>
    <button id="profile">
      <img src="assets/logo.jpg" alt="Profile" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 rx=%2245%22 fill=%22%237c3aed%22/%3E%3Ctext x=%22100%22 y=%22122%22 text-anchor=%22middle%22 font-size=%2282%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22%3EA2%3C/text%3E%3C/svg%3E'">
      Kareem
    </button>
  </div>
</header>
<section id="content"></section>
</main>
</div>
<nav class="mobile-dock" aria-label="Mobile navigation">
  <button onclick="go('dashboard')">⌂<br>Home</button>
  <button onclick="go('assignments')">✓<br>Tasks</button>
  <button onclick="go('chat')">◌<br>Chat</button>
  <button onclick="go('notifications')">♢<br>Alerts</button>
  <button onclick="commandCenter()">⌕<br>More</button>
</nav>
<div id="toast"></div>
<div id="back"><div id="modal"></div></div>
<script src="app.js"></script>
</body>
</html>
